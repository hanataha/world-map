<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1230">
<title>UDverse Interactive Map</title>
<link rel="preload" as="image" href="assets/map/udverse-map.webp">
<style>
:root{--bg:#070d22;--panel:rgba(12,20,48,.92);--line:rgba(160,190,255,.22);--ink:#e8eeff;--mute:#9aa8cc;--acc:#7fb4ff;--gold:#e9c46a;--danger:#ff7a6b;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh;width:100%}
.hud{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#0c1638,#0a1230);border-bottom:1px solid var(--line);min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;white-space:nowrap}
.back:hover,.back:focus-visible{border-color:var(--acc);color:var(--acc)}
.title{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.title small{display:block;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--mute);font-size:12px}
.search{position:relative;flex:0 1 260px;min-width:0}
.search input{width:100%;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:#0b1430;outline:none}
.search input:focus{border-color:var(--acc)}
.results{position:absolute;top:110%;left:0;right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);list-style:none;margin:0;padding:4px;max-height:50vh;overflow:auto;display:none}
.results.open{display:block}
.results li{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.results li[aria-selected=true],.results li:hover{background:rgba(127,180,255,.15)}
.main{position:relative;display:grid;grid-template-columns:1fr 340px;min-height:0;min-width:0}
.stage{position:relative;overflow:hidden;min-width:0;background:radial-gradient(ellipse at center,#0f1d4a,#060b1d);touch-action:none;cursor:grab;outline:none}
.stage.drag{cursor:grabbing}
.stage:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px;pointer-events:none}
.region{cursor:pointer;fill-opacity:0;stroke-opacity:0;stroke-width:1.4;vector-effect:non-scaling-stroke;transition:fill-opacity .15s,stroke-opacity .15s}
.region.zone{fill-opacity:.12;stroke-opacity:.7;stroke-dasharray:4 3}
.region.front{fill-opacity:.18;stroke-opacity:.9}
.region:hover,.region.hover{fill-opacity:.35;stroke-opacity:1;stroke:#fff}
.region:focus{outline:none}
.region:focus-visible,.region.sel{fill-opacity:.45;stroke-opacity:1;stroke:#fff;stroke-width:2.6}
.region.dim{opacity:.0;pointer-events:none}
.mapdim .region:not(.sel):not(:hover):not(.zone):not(.front){fill-opacity:0}
.lbl{font-size:10px;fill:#fff;paint-order:stroke;stroke:#050a1c;stroke-width:3px;pointer-events:none;text-anchor:middle;font-weight:600;letter-spacing:.03em;opacity:.85}
.lbl.dim{display:none}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-130%);display:none}
.tip b{display:block}.tip span{color:var(--mute);font-size:12px}
.ctrls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:10}
.ctrls button,.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.ctrls button{width:44px;height:44px;font-size:20px;line-height:1}
.ctrls button:hover,.ctrls button:focus-visible,.chip:focus-visible{border-color:var(--acc);outline:none}
.legend{position:absolute;left:12px;bottom:12px;z-index:10;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;font-size:13px;min-height:40px}
.chip[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block;border:1px solid #fff8}
.sw.zone{border-style:dashed;background:transparent!important}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0;display:flex;flex-direction:column}
.ph{padding:14px 16px 6px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ph h2{margin:0;font-size:22px;line-height:1.15}
.ph .sub{color:var(--mute);font-style:italic;font-size:14px;margin-top:2px}
.close{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none;display:none}
.badge{align-self:flex-start;display:inline-block;margin:0 16px 8px;padding:3px 8px;border-radius:999px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--mute)}
.pimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0b1430}
.pbody{padding:12px 16px;font-size:15px;line-height:1.55;color:#d3dcf5}
.note,.approx{margin:0 16px 10px;padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.45}
.note{background:rgba(233,196,106,.1);border:1px solid rgba(233,196,106,.35);color:#f3dfa6}
.approx{background:rgba(127,180,255,.08);border:1px solid var(--line);color:var(--mute)}
.pnav{display:flex;gap:8px;padding:6px 16px 16px}
.pnav button{flex:1;padding:10px;border-radius:10px;background:#0b1430;border:1px solid var(--line);cursor:pointer}
.pnav button:focus-visible,.pnav button:hover{border-color:var(--acc);outline:none}
.intro{padding:18px 16px;color:var(--mute);font-size:14px;line-height:1.5}
.intro h2{color:var(--ink);font-size:18px;margin:0 0 8px}
.list{list-style:none;margin:8px 0 0;padding:0}
.list button{width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding:9px 6px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.list button:hover,.list button:focus-visible{color:var(--acc);outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){
 .main{grid-template-columns:1fr}
 .title small{display:none}
 .back .t{display:none}
 .search{flex:1 1 auto}
 .title{flex:0 1 auto;font-size:12px}
 .panel{position:absolute;left:0;right:0;bottom:0;max-height:62%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(calc(100% - 52px));transition:transform .25s;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
 .panel.open{transform:none}
 .panel::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:#fff4;margin:8px auto 0;flex:none}
 .close{display:block}
 .legend{bottom:62px}
 .ctrls button{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

stage.addEventListener('pointermove',ev=>{if(!pts.has(ev.pointerId))return;pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const ns=Math.max(minS,Math.min(10,pinch.s*d/pinch.d));const k=ns/pinch.s;view.s=ns;view.x=pinch.m.x-(pinch.m.x-pinch.vx)*k;view.y=pinch.m.y-(pinch.m.y-pinch.vy)*k;apply();return}
 if(start&&pts.size===1){const dx=ev.clientX-start.x,dy=ev.clientY-start.y;if(!moved&&Math.hypot(dx,dy)>6){moved=true;stage.classList.add('drag');try{stage.setPointerCapture(ev.pointerId)}catch(_){}}
  if(moved){view.x=start.vx+dx;view.y=start.vy+dy;apply();hideTip()}}});
function up(ev){if(!pts.has(ev.pointerId))return;pts.delete(ev.pointerId);stage.classList.remove('drag');
 if(pts.size===0){if(!moved&&start){const r=start.t.closest&&start.t.closest('.region');if(r)select(byId(r.dataset.id),false);else if(sel&&ev.pointerType!=='mouse'){}}
  start=null;pinch=null}}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('keydown',ev=>{if(ev.target!==stage)return;const st=60;const K=ev.key;const c=center();
 if(K==='+'||K==='='){zoomAt(1.3,c.x,c.y)}else if(K==='-'||K==='_'){zoomAt(1/1.3,c.x,c.y)}
 else if(K==='0'){resetView()}
 else if(K==='ArrowLeft'){view.x+=st;apply()}else if(K==='ArrowRight'){view.x-=st;apply()}
 else if(K==='ArrowUp'){view.y+=st;apply()}else if(K==='ArrowDown'){view.y-=st;apply()}
 else return;ev.preventDefault()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if($('results').classList.contains('open'))closeRes();else if(sel){const e=sel;clearSel();e.el.focus()}}});
// search
const q=$('q'),res=$('results');let hits=[],hi=-1;
function closeRes(){res.classList.remove('open');q.parentElement.setAttribute('aria-expanded','false');hi=-1}
function renderRes(){res.innerHTML=hits.map((d,i)=>`<li role="option" id="opt-${i}" aria-selected="${i===hi}" data-i="${i}"><span class="sw" style="background:${d.color}"></span>${esc(d.name)} <small style="color:var(--mute)">${esc(TYPES[d.type].one)}</small></li>`).join('')||'<li aria-disabled="true">No matches</li>';
 res.classList.add('open');q.parentElement.setAttribute('aria-expanded','true');q.setAttribute('aria-activedescendant',hi>=0?'opt-'+hi:'')}
q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase();if(!t){closeRes();return}hits=DATA.filter(d=>(d.name+' '+d.sub+' '+d.body).toLowerCase().includes(t)).slice(0,12);hi=hits.length?0:-1;renderRes()});
q.addEventListener('keydown',ev=>{if(!res.classList.contains('open'))return;if(ev.key==='ArrowDown'){hi=Math.min(hits.length-1,hi+1);renderRes();ev.preventDefault()}else if(ev.key==='ArrowUp'){hi=Math.max(0,hi-1);renderRes();ev.preventDefault()}else if(ev.key==='Enter'&&hits[hi]){pick(hits[hi]);ev.preventDefault()}});
res.addEventListener('click',ev=>{const li=ev.target.closest('li[data-i]');if(li)pick(hits[+li.dataset.i])});
function pick(d){closeRes();q.value='';select(d,true);d.el.focus({preventScroll:true})}
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.search'))closeRes()});
// phone sheet: tap handle area toggles
panel.addEventListener('click',ev=>{if(matchMedia('(max-width:820px)').matches&&!panel.classList.contains('open')){panel.classList.add('open')}});
// deep link
intro();fit();resetView();
const h=decodeURIComponent(location.hash.slice(1));if(h&&byId(h))select(byId(h),true);
window.addEventListener('hashchange',()=>{const d=byId(decodeURIComponent(location.hash.slice(1)));if(d)select(d,true)});
</script>
</body>
